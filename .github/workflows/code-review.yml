name: Code Review

# Was a job in deploy-development.yml, running automatically on every push to
# `development` (Plan Item 4). Converted to manual-only: `development` is a
# direct-push branch that gets pushed to constantly under this project's
# branching model, so a Claude API call on every single push was burning
# cost for reviews nobody had asked to see yet. Same manual-only conversion
# already applied to production-watch.yml -> production-update.yml (Item 0).
#
# Trigger from the Actions tab ("Run workflow"), or:
#   gh workflow run code-review.yml -f range=HEAD~5...HEAD

on:
  workflow_dispatch:
    inputs:
      range:
        description: 'Git range/ref to review (e.g. HEAD~5...HEAD, a branch name). Blank = latest commit on the selected branch.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the GitHub OIDC token WIF exchanges for Anthropic auth
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/anthropic-oidc-token
      REVIEW_RANGE: ${{ inputs.range }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needs real history to diff against, not a shallow clone
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Fetch GitHub OIDC token for Anthropic WIF
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Run code review
        id: review
        run: node scripts/run-code-review.js
      - name: Post review to Slack
        if: steps.review.outputs.review != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Passed via env, not interpolated into the script body — the review
          # text is LLM-generated and could contain backticks/$()/quotes that
          # would otherwise be interpreted as shell syntax (GitHub's own
          # documented script-injection risk for ${{ }} inside `run:`).
          REVIEW_TEXT: ${{ steps.review.outputs.review }}
          RANGE_LABEL: ${{ steps.review.outputs.range }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret not set — skipping Slack notification."
            exit 0
          fi
          TEXT="Code review requested by $ACTOR ($RANGE_LABEL):
          $REVIEW_TEXT"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$TEXT" '{text: $text}')" \
            "$SLACK_WEBHOOK_URL"
