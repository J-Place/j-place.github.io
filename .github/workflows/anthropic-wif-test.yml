name: Anthropic WIF connectivity test

# Temporary — delete this file once it's confirmed working. Not part of the
# plan's real Items 0-4; exists only to verify the WIF setup (Console-side
# federation rule + service account, just configured) actually works,
# using the exact fetch mechanism the real workflows use, before trusting it
# there. See production-update.yml / deploy-development.yml's `review` job
# for the real usage.

on:
  workflow_dispatch: # manual only — no need for this to fire on every push

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/anthropic-oidc-token
    steps:
      - name: Fetch GitHub OIDC token for Anthropic WIF
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Say hello via claude -p (proves the full WIF chain works)
        run: |
          claude -p "Reply with exactly: WIF connectivity test passed." --output-format json --tools ""
