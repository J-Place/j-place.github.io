openapi: 3.1.0
info:
  title: USMS Top Times API
  version: 0.1.0
  summary: Ranked individual swims by event, season, gender and age group.
  description: |
    The data behind usms.org's Event Rankings (comp/meets/toptimes.php →
    eventrank.php), as JSON, for Swim Tools.

    **Status: draft contract.** Nothing serves this API yet. Today the mockup
    reads the same responses as pre-built static files (see *Static files*
    below). The intent is that a real endpoint, a Netlify Function first and
    later production's own `/apis/v1/`, returns exactly these shapes, so the
    page only changes its base URL.

    ## Static files

    Every `GET /top-times` response that exists is also published as a static
    file with the identical body, at

    `/data/top-times/{season}/{gender}-{age}/{course}/{stroke}/{distance}.json`

    using the same lowercase parameter values, e.g.
    `/data/top-times/2026/men-40-44/scy/free/50.json` is
    `GET /top-times?season=2026&gender=men&age=40-44&course=scy&stroke=free&distance=50`.
    `GET /top-times/available` is `/data/top-times/available.json`. Static
    files ignore `limit` (they always hold the full list) and have no error
    responses: a missing file is a 404 from the host, with no body.

    ## Provenance: real and synthetic rankings

    Every ranking says where it came from in `provenance` (and so does each
    dataset in `/top-times/available`):

    - `usms`: scraped from usms.org's event rankings. Real results.
    - `synthetic`: generated by `scripts/top-times-synthetic.js` to stand in
      for seasons and age groups that haven't been scraped yet. Modeled from
      real USMS percentile cuts and the shape of the real rankings, so it
      looks realistic, but **it isn't anyone's result**: its swimmers have no
      `name`, `club` or `meet`. Pages should say so wherever they show it.

    A real scrape always replaces synthetic data for the same dataset. A
    ranking without `provenance` predates the field and is `usms`.

    Where the files live: real scrapes are committed in
    `src/data/top-times/`. Everything else is rebuilt before every build
    (npm `prebuild`/`predev`) into the gitignored
    `src/data/top-times-generated/`: synthetic rankings, Top 10 history back
    to 1970–71 (only the Top 10 listed, `truncated`, with a modeled `total`;
    the seasons with real USMS Top 10 lists are `usms` without names), and
    `available.json` over both folders. Both publish at `/data/top-times/`.

    ## Seasons

    A season is named by the year it ends. For SCY, season 2026 runs
    2025-06-01 through 2026-05-31 (as eventrank.php reports it). SCM and LCM
    seasons on usms.org are calendar years. No SCM or LCM data is loaded yet.

    ## Events

    Only events swum in that course are valid; any other stroke/distance pair
    is a 400.

    | Course | Free | Back, Breast, Fly | IM |
    |---|---|---|---|
    | scy | 25, 50, 100, 200, 500, 1000, 1650 | 25, 50, 100, 200 | 100, 200, 400 |
    | scm | 50, 100, 200, 400, 800, 1500 | 50, 100, 200 | 100, 200, 400 |
    | lcm | 50, 100, 200, 400, 800, 1500 | 50, 100, 200 | 200, 400 |

    The SCM and LCM rows follow USMS's recognized events and need confirming
    when that data is added (usms.org's own forms also offer 25s and 1000 m).
servers:
  - url: http://localhost:8888/api
    description: Planned Netlify Function under `netlify dev`. Not built yet; the static files use paths, not these query URLs.
tags:
  - name: Top Times
paths:
  /top-times:
    get:
      tags: [Top Times]
      operationId: getTopTimes
      summary: One event's ranking for a season, gender and age group
      description: |
        Swimmers in rank order, fastest first. Tied swimmers share a rank.
        An event with no ranked swims returns 200 with an empty `swimmers`
        list. A combination that hasn't been loaded (see
        `/top-times/available`) is a 404.
      parameters:
        - $ref: '#/components/parameters/season'
        - $ref: '#/components/parameters/gender'
        - $ref: '#/components/parameters/age'
        - $ref: '#/components/parameters/course'
        - $ref: '#/components/parameters/stroke'
        - $ref: '#/components/parameters/distance'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: The ranking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopTimes' }
              examples:
                ranking:
                  summary: Men 40-44 SCY 50 Free, 2026 (first two of 339)
                  value:
                    course: scy
                    season: 2026
                    seasonLabel: 2025–2026
                    gender: men
                    age: 40-44
                    stroke: free
                    distance: 50
                    event: 50 Free
                    updated: '2026-10-13'
                    total: 339
                    truncated: false
                    swimmers:
                      - { rank: 1, name: 'Swimmer, Example A', age: 42, time: '20.95', club: CLUB, meet: Example Meet }
                      - { rank: 2, name: 'Swimmer, Example B', age: 44, time: '21.10', club: CLUB, meet: Example Meet }
                empty:
                  summary: An event nobody swam that season
                  value:
                    course: scy
                    season: 2021
                    seasonLabel: 2020–2021
                    gender: men
                    age: 50-54
                    stroke: back
                    distance: 25
                    event: 25 Back
                    updated: '2026-10-13'
                    total: 0
                    truncated: false
                    swimmers: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /top-times/available:
    get:
      tags: [Top Times]
      operationId: getTopTimesAvailable
      summary: Which seasons, genders, age groups and courses are loaded
      description: |
        For filling a page's pickers. Each dataset is one season × gender ×
        age group × course; every valid event for that course is available
        within it (see Events above).
      responses:
        '200':
          description: The loaded datasets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Available' }
              example:
                updated: '2026-10-13'
                datasets:
                  - { course: scy, season: 2026, gender: men, age: 40-44 }
                  - { course: scy, season: 2026, gender: men, age: 50-54 }
                events:
                  scy:
                    free: [25, 50, 100, 200, 500, 1000, 1650]
                    back: [25, 50, 100, 200]
                    breast: [25, 50, 100, 200]
                    fly: [25, 50, 100, 200]
                    im: [100, 200, 400]
components:
  parameters:
    season:
      name: season
      in: query
      required: true
      description: Season, named by the year it ends (see Seasons).
      schema: { type: integer, minimum: 2004, example: 2026 }
    gender:
      name: gender
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Gender' }
    age:
      name: age
      in: query
      required: true
      description: A USMS age group, low-high.
      schema: { $ref: '#/components/schemas/AgeGroup' }
    course:
      name: course
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Course' }
    stroke:
      name: stroke
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Stroke' }
    distance:
      name: distance
      in: query
      required: true
      description: In the course's unit (yards for scy, meters otherwise).
      schema: { type: integer, enum: [25, 50, 100, 200, 400, 500, 800, 1000, 1500, 1650] }
    limit:
      name: limit
      in: query
      required: false
      description: Return only the first N swimmers. `total` still counts them all. Ignored by static files.
      schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
  schemas:
    Course:
      type: string
      enum: [scy, scm, lcm]
    Gender:
      type: string
      enum: [men, women]
    Stroke:
      type: string
      enum: [free, back, breast, fly, im]
    AgeGroup:
      type: string
      enum: [18-24, 25-29, 30-34, 35-39, 40-44, 45-49, 50-54, 55-59, 60-64, 65-69, 70-74, 75-79, 80-84, 85-89, 90-94, 95-99, 100-104, 105-109]
    Time:
      type: string
      description: Swim time as usms.org shows it, m:ss.hh or ss.hh.
      pattern: '^(\d+:)?\d{1,2}\.\d{2}$'
      examples: ['21.84', '1:58.30', '17:42.07']
    Provenance:
      type: string
      enum: [usms, synthetic]
      description: Where the ranking came from (see Provenance). Missing means usms.
    Swimmer:
      type: object
      required: [rank, age, time]
      description: name, club and meet are always present in usms rankings and never in synthetic ones.
      properties:
        rank: { type: integer, minimum: 1, description: Place in the ranking. Ties share a rank. }
        name: { type: string, description: 'As usms.org lists it: "Last, First M".' }
        age: { type: integer, description: Age at the time of the swim. }
        time: { $ref: '#/components/schemas/Time' }
        club: { type: string, description: USMS club abbreviation. }
        meet: { type: string, description: Name of the meet the swim was at. }
    TopTimes:
      type: object
      required: [course, season, seasonLabel, gender, age, stroke, distance, event, updated, total, truncated, swimmers]
      properties:
        course: { $ref: '#/components/schemas/Course' }
        season: { type: integer }
        seasonLabel: { type: string, description: 'For display, e.g. "2025–2026" (SCY) or "2026" (SCM, LCM).' }
        gender: { $ref: '#/components/schemas/Gender' }
        age: { $ref: '#/components/schemas/AgeGroup' }
        stroke: { $ref: '#/components/schemas/Stroke' }
        distance: { type: integer }
        event: { type: string, description: 'For display, e.g. "50 Free".' }
        updated: { type: string, format: date, description: When this ranking was last fetched from usms.org, or generated. }
        provenance: { $ref: '#/components/schemas/Provenance' }
        total:
          type: integer
          description: How many swimmers the ranking holds, before `limit`. At most 500.
        truncated:
          type: boolean
          description: |
            True when usms.org's 500-swimmer cap cut the ranking off: the real
            field is bigger, and the list holds only its fastest 500.
        swimmers:
          type: array
          items: { $ref: '#/components/schemas/Swimmer' }
    Available:
      type: object
      required: [updated, datasets, events]
      properties:
        updated: { type: string, format: date, description: The most recent `updated` of any dataset. }
        datasets:
          type: array
          items:
            type: object
            required: [course, season, gender, age, provenance]
            properties:
              course: { $ref: '#/components/schemas/Course' }
              season: { type: integer }
              gender: { $ref: '#/components/schemas/Gender' }
              age: { $ref: '#/components/schemas/AgeGroup' }
              provenance: { $ref: '#/components/schemas/Provenance' }
        events:
          type: object
          description: Valid distances per course and stroke, for the courses that have datasets.
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items: { type: integer }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, enum: [bad_request, not_found] }
        message: { type: string }
  responses:
    BadRequest:
      description: A parameter is missing or invalid, or the stroke/distance pair isn't swum in that course.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: bad_request, message: 1650 back is not an SCY event. }
    NotFound:
      description: That season, gender, age group and course aren't loaded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not_found, message: No data for scy 2012 men 40-44. }
